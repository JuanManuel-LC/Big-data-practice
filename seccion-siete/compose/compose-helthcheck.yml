# Healthcheck: Compose espera a que el servicio este DE VERDAD listo

services:
  postgres:
    image: postgres:16
    enviornment:
      POSTGRES_PASSWORD: secreto123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      internal: 3s
      timeout: 3s
      retries: 5

  etl:
    build: .
    depends_on:
      postgres:
        condition: service_healthy  # <--- Espera al healthcheck, no solo al arranque