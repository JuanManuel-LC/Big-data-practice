# docker-compose.yml con redes explicitas

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASWORD: secreto123
    networks:
      - backend # Solo accesible desde la red "backend"

  redis:
    image: redis:7-alpine
    networks:
      - backend # Solo accesible desde la red "backend"

  app:
    build: .
    networks:
      - backend    # Puede hablar con db y redis
      - frontend   # Tambien expuesta al frontend
    ports:
      - "8000:8000"

  
  web:
    image: nginx:alpine
    networks:
      - frontend   # Solo puede hablar con app, NO con db directamente
    ports:
      - "80:80"

networks:
  backend:
  frontend:
    