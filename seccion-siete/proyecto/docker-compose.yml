# Archivo: docker-compose.yml
# Para levantar el proyecto, haz: docker compose up --build, para tumbar: docker compose down (añadir -v para eliminar volumen)

services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: etl_user
            POSTGRES_PASSWORD: etl_secreto
            POSTGRES_DB: ventas
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U etl_user -d ventas"]
            interval: 2s
            timeout: 5s
            retries: 10
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./init-db:/docker-entrypoint-initdb.d     # Ejecuta schema.sql al inicio

    pgadmin:
        image: dpage/pgadmin4:latest
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@datos.com
            PGADMIN_DEFAULT_PASSWORD: admin123
        ports:
            - "8080:80"
        depends_on:
            - postgres

    etl:
        build: .
        environment:
            DB_HOST: postgres
            DB_USER: etl_user
            DB_PASS: etl_secreto
            DB_NAME: ventas
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./data:/app/data  # Montar los CSVs

volumes:
    pgdata: