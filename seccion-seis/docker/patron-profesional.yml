# docke-compose.yml -- patron de desarrollo profesional
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secreto123
      POSTGRES_DB: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # Datos persistentes

  app:
    build: .
    volumes:
      - ./src:/app/src    # Codigo en hot-reload
      - ./data:/app/data  # Datasets locales
    environment:
      DATABASE_URL: postgresql://postgres:secreto123@db:5432/dev
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  pgdata:

