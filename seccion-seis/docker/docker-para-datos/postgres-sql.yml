# docker-compose.yml -- PostgreSQL para aprender SQL

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: alumno
      POSTGRES_PASSWOR: bigdatastack
      POSTGRES_DB: aprendiendo_sql
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # Script inicial - solo funciona la primera vez al crear

volumes:
  postgres_data: